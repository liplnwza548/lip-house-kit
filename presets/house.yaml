# House presets — สูตรมาตรฐานบ้าน (Lip-locked, 2026-09-29)
# เปลี่ยนค่าที่นี่ = เปลี่ยนทุกโรงพร้อมกัน ห้าม hardcode ค่าเหล่านี้ในสคริปต์งาน

audio:
  master_lufs: -15.0
  master_tolerance: 1.0
  true_peak_ceiling_dbtp: -1.0
  vo_stem_lufs: -17.0
  vo_stem_tp_ceiling_dbtp: -3.0
  bgm_level_db: -20.0
  bgm_fade_s: 1.0
  duck_threshold: 0.015
  duck_ratio: 8
  sfx_bus_level: 0.2
  fixed_makeup_db: 1.0
  bed_lift_nominal_db: 2.0
  speech_tolerance_db: 1.5
  centroid_drift_max: 0.10
  # BGM หลัก (Lip-locked 2026-09-30 — เปียโนกลาง ไม่เร็วไม่ช้า, Pixabay Commercial-use)
  tracks:
    - id: piano-corporate-482783
      mood: main
    - id: piano-motivational-148119
      mood: alt
    # BGM เสริม (Lip เลือก 2026-09-30 — ชอบ 3 จาก 4, ตัด piano-my-little-prince-815 ออก)
    - id: guitar-tears-of-joy-839
      mood: alt-guitar
    - id: chill-sleepy-cat-135
      mood: alt-lofi
    - id: upbeat-feeling-happy-5
      mood: alt-upbeat
  # SFX ประจำบ้าน (Lip-locked 2026-09-30 — สังเคราะห์เอง ใช้ทั้งหมด)
  sfx_set: [click, pop, fast_whoosh, short_whoosh, impact_soft,
            riser_08, ching, pop_low]
  # ฟิลเตอร์ 3 ลุค (Lip เอาทั้งหมด 2026-09-30 — สูตรใน asset-research/filter_tests/FILTERS.md)
  filter_looks: [vivid, warm, clean]
  # ฟอนต์ไทย OFL (2026-09-30 — รอพี่ลิปดูตัวอย่างก่อนล็อกตัวหลัก)
  thai_fonts: [Kanit-Bold, Mitr-SemiBold, Sarabun-Bold]
hooks:
  # Hook หลัก (Lip-locked 2026-09-30)
  primary: [H02_flash_split, H03_rounded_reveal]
  parked: [H01_rapid5, H04_motion_hero]

subtitle:
